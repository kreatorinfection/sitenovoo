<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pagamento - SuperPoderes</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <header class="cabecalho">

        <h2><span>SUPERPODERES</span></h2>

        <a href="index.html">
            Voltar
        </a>

    </header>


    <main>

        <section class="final">

            <p class="pequeno">
                CHECKOUT
            </p>

            <h2>
                Seu superpoder está
                <span>quase pronto.</span>
            </h2>

            <p class="checkout-description">
                Escolha uma forma de pagamento para continuar.
            </p>


            <div class="card checkout-card">

                <h3>
                     Superpoder de invisibilidade
                </h3>

                <strong>
                    R$ 349,90
                </strong>


                <form>

                    <input
                        type="text"
                        placeholder="Nome completo"
                    >

                    <input
                        type="email"
                        placeholder="E-mail"
                    >

                    <button
                        type="button"
                        onclick="window.location.href='sucesso.html'"
                        class="botao"
                    >
                        Confirmar pagamento
                    </button>

                </form>

            </div>

        </section>

    </main>


    

</body>

</html>
